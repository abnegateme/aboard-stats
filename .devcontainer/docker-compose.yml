services:
  dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    init: true

    command:
      - bash
      - -lc
      - |
        sudo chown -R "$(id -u):$(id -g)" /home/vscode/.codex
        chmod 700 /home/vscode/.codex
        mkdir -p /home/vscode/.codex/ipc
        chmod 700 /home/vscode/.codex/ipc
        exec sleep infinity

    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    volumes:
      - type: bind
        source: ..
        target: /workspace

      - type: volume
        source: codex-data
        target: /home/vscode/.codex

volumes:
  codex-data: